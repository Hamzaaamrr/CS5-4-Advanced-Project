<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Court | PlayConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100;300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
        :root{
            --primary: #FF2E8C;
            --bg: #13131b;
            --card: rgba(26, 26, 46, 0.6);
            --muted: #94a3b8;
            --on-surface: #e4e1ed;
            --glass-border: rgba(255,255,255,0.07);
        }
        body{
            margin:0; font-family: 'Lexend', sans-serif; background: var(--bg); color: var(--on-surface); min-height:100vh;
            padding-bottom: 4rem;
        }
        .site-header { position: fixed; top:0; width:100%; z-index:50; display:flex; justify-content:space-between; align-items:center; padding:0 1.5rem; height:4rem; background: rgba(10,10,18,0.8); backdrop-filter: blur(24px); border-bottom: 1px solid rgba(255,255,255,0.03);} 
        .logo { font-size: 1.4rem; font-weight: 900; font-style: italic; letter-spacing: -0.03em; color: var(--primary); }
        .site-nav { display:flex; gap:1rem; align-items:center; }
        .nav-link { color: #94a3b8; font-size:0.9rem; font-weight:600; text-decoration:none; }
        .nav-link-active { color: var(--primary); font-weight:700; text-decoration:none; }
        .btn-logout { padding:0.4rem 0.9rem; border-radius:9999px; cursor:pointer; background: transparent; border:1px solid rgba(255,100,100,0.12); color:#ffb4ab; font-weight:700 }

        .main { padding-top:5.5rem; padding-left:1.5rem; padding-right:1.5rem; max-width:68rem; margin:0 auto }

        /* Form card */
        .form-card{ background: var(--card); backdrop-filter: blur(40px); border:1px solid var(--glass-border); border-radius: 12px; padding: 28px; max-width:900px; margin: 0 auto; }
        .section-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
        .section-title{ font-size:1.25rem; font-weight:800; color: #fff; }

        label{ display:block; font-size:0.8rem; font-weight:700; color:var(--muted); margin-bottom:6px; }
        .form-card input,
        .form-card select,
        .form-card textarea{
            width:100%;
            padding:10px 12px;
            border-radius:10px;
            border:1px solid rgba(255,255,255,0.08);
            background-color:#1f1f27 !important;
            color:#e4e1ed !important;
            caret-color:#e4e1ed;
            outline:none;
            -webkit-text-fill-color:#e4e1ed;
            appearance:none;
            -webkit-appearance:none;
            -moz-appearance:none;
        }
        .form-card input::placeholder,
        .form-card textarea::placeholder{ color:#94a3b8; }
        .form-card select option{ color:#e4e1ed; background:#1f1f27; }
        .form-card input:focus,
        .form-card select:focus,
        .form-card textarea:focus{
            box-shadow: 0 0 0 3px rgba(255,46,140,0.08);
            border-color: rgba(255,46,140,0.3);
            background-color:#25252e !important;
        }
        .form-card input[type="file"]{
            padding:9px 12px;
            color:#e4e1ed !important;
        }
        .form-card input[type="file"]::file-selector-button{
            background:#2a2a36;
            color:#e4e1ed;
            border:1px solid rgba(255,255,255,0.08);
            border-radius:8px;
            padding:8px 12px;
            margin-right:12px;
            cursor:pointer;
        }
        .form-card input[type="file"]::-webkit-file-upload-button{
            background:#2a2a36;
            color:#e4e1ed;
            border:1px solid rgba(255,255,255,0.08);
            border-radius:8px;
            padding:8px 12px;
            margin-right:12px;
            cursor:pointer;
        }
        .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
        .full { grid-column: 1 / -1; }
        .actions{ margin-top:16px; display:flex; gap:10px; align-items:center; }
        .btn-primary{ background: var(--primary); color:#fff; border:none; padding:10px 14px; border-radius:10px; font-weight:800; cursor:pointer; box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 24px rgba(255,46,140,0.08); }
        .btn-cancel{ background: transparent; border:1px solid rgba(255,255,255,0.06); color:var(--muted); padding:9px 12px; border-radius:10px; text-decoration:none; }

        @media (max-width:640px){ .grid{ grid-template-columns:1fr; } .site-nav{ display:none; } }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <span class="logo">PlayConnect</span>
        <nav class="site-nav">
            <a th:href="@{/home}" class="nav-link">Dashboard</a>
            <a th:href="@{/bookings}" class="nav-link">My Bookings</a>
            <a th:if="${isAdmin}" th:href="@{/admin/dashboard}" class="nav-link">Admin Dashboard</a>

        </nav>
        <div style="display:flex;align-items:center;gap:0.75rem;">
            <form method="post" th:action="@{/logout}" style="display:inline;">
                <button class="btn-logout" type="submit">Logout</button>
            </form>
        </div>
    </header>

    <main class="main">
        <div class="section-header">
            <h1 class="section-title">Create Court</h1>
            <div></div>
        </div>

        <div class="form-card">
            <form th:action="@{/courts}" th:object="${court}" method="post" enctype="multipart/form-data">
                <div class="grid">
                    <div>
                        <label for="name">Name</label>
                        <input id="name" th:field="*{name}" required />
                    </div>
                    <div>
                        <label for="sportType">Sport Type</label>
                        <select id="sportType" th:field="*{sportType}" required>
                            <option th:each="type : ${sportTypes}" th:value="${type}" th:text="${type}"></option>
                        </select>
                    </div>
                    <div class="full">
                        <label for="description">Description</label>
                        <textarea id="description" th:field="*{description}" required></textarea>
                    </div>
                    <div>
                        <label for="address">Address</label>
                        <input id="address" th:field="*{address}" required />
                    </div>
                    <div>
                        <label for="pricePerHour">Price per Hour</label>
                        <input id="pricePerHour" type="number" step="0.01" th:field="*{pricePerHour}" required />
                    </div>
                    <div class="full">
                        <label for="thumbnailFile">Court Photo</label>
                        <input id="thumbnailFile" name="thumbnailFile" type="file" accept="image/*" />
                    </div>
                </div>

                <div class="actions">
                    <button class="btn-primary" type="submit">Create Court</button>
                    <a class="btn-cancel" th:href="@{/home}">Cancel</a>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
