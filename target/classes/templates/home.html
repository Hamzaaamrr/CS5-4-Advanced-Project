<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PlayConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100;300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary":               "#ffb1c7",
                        "primary-container":     "#ff4993",
                        "on-primary-container":  "#59002b",
                        "secondary":             "#e6feff",
                        "secondary-container":   "#00f4fe",
                        "error":                 "#ffb4ab",
                        "surface":               "#13131b",
                        "background":            "#13131b",
                        "on-background":         "#e4e1ed",
                        "surface-container":     "#1f1f27",
                        "surface-container-high":"#292932"
                    }
                }
            }
        }
    </script>
    <style>
        /* ── Base ───────────────────────────────────────────── */
        .icon { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .icon-fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

        body {
            background: #13131b;
            color: #e4e1ed;
            font-family: 'Lexend', sans-serif;
            min-height: 100vh;
            padding-bottom: 4rem;
        }

        /* ── Header ─────────────────────────────────────────── */
        .site-header {
            position: fixed; top: 0; width: 100%; z-index: 50;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 1.5rem; height: 4rem;
            background: rgba(10, 10, 18, 0.8);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo { font-size: 1.5rem; font-weight: 900; font-style: italic; letter-spacing: -0.05em; color: #FF2E8C; }

        .site-nav { display: none; gap: 2rem; align-items: center; }
        @media (min-width: 768px) { .site-nav { display: flex; } }

        .nav-link       { color: #94a3b8; font-size: 0.875rem; font-weight: 600; text-decoration: none; transition: color 0.2s; }
        .nav-link:hover { color: #FF2E8C; }
        .nav-link-active { color: #FF2E8C; border-bottom: 2px solid #FF2E8C; font-size: 0.875rem; font-weight: 600; text-decoration: none; }

        /* "+ Add Court" pill button */
        .btn-add-court {
            display: flex; align-items: center; gap: 0.375rem;
            padding: 0.4rem 1rem; border-radius: 9999px; border: none; cursor: pointer;
            background: #FF2E8C; color: #fff;
            font-size: 0.8rem; font-weight: 700; font-family: 'Lexend', sans-serif;
            box-shadow: 0 0 16px rgba(255,46,140,0.4);
            text-decoration: none; transition: opacity 0.2s;
        }
        .btn-add-court:hover { opacity: 0.85; }

        /* logout */
        .btn-logout {
            padding: 0.4rem 1rem; border-radius: 9999px; cursor: pointer;
            background: transparent; border: 1px solid rgba(255,100,100,0.3);
            color: #ffb4ab; font-size: 0.75rem; font-weight: 700;
            font-family: 'Lexend', sans-serif; transition: background 0.2s;
        }
        .btn-logout:hover { background: rgba(255,100,100,0.1); }

        /* avatar circle */
        .avatar {
            width: 2rem; height: 2rem; border-radius: 9999px;
            background: linear-gradient(135deg, #FF2E8C, #ff4993);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: 800; color: #fff;
            border: 2px solid rgba(255,255,255,0.15);
        }

        /* ── Main layout ─────────────────────────────────────── */
        .main { padding-top: 5.5rem; padding-left: 1.5rem; padding-right: 1.5rem; max-width: 80rem; margin: 0 auto; }

        /* ── Welcome banner ──────────────────────────────────── */
        .welcome-banner { margin-bottom: 2rem; }
        .welcome-title  { font-size: 2rem; font-weight: 800; color: #fff; margin-bottom: 0.25rem; }
        .welcome-title span { color: #FF2E8C; }
        .welcome-sub    { color: #94a3b8; font-size: 0.875rem; }

        /* ── Stats row ───────────────────────────────────────── */
        .stats-row { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-bottom: 2.5rem; }
        @media (min-width: 640px)  { .stats-row { grid-template-columns: repeat(3, 1fr); } }

        .stat-card {
            background: rgba(26, 26, 46, 0.6);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 1rem; padding: 1.25rem 1.5rem;
        }
        .stat-label { font-size: 0.75rem; color: #64748b; font-weight: 600; margin-bottom: 0.5rem; }
        .stat-value { font-size: 1.75rem; font-weight: 800; color: #fff; margin-bottom: 0.25rem; }
        .stat-trend { font-size: 0.75rem; font-weight: 600; }
        .trend-up   { color: #34d399; }
        .trend-ok   { color: #FF2E8C; }

        /* ── Section header ──────────────────────────────────── */
        .section-header {
            display: flex; justify-content: space-between; align-items: center; gap: 1rem;
            margin-bottom: 1.25rem;
        }
        .section-title { font-size: 1.125rem; font-weight: 700; color: #fff; }
        .view-all { font-size: 0.8rem; font-weight: 600; color: #FF2E8C; text-decoration: none; }
        .view-all:hover { text-decoration: underline; }

        .section-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .search-pill {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 2.75rem;
            height: 2.75rem;
            border-radius: 9999px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.05);
            transition: width 0.25s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .search-pill:hover,
        .search-pill:focus-within {
            width: 18rem;
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,46,140,0.25);
            box-shadow: 0 0 0 3px rgba(255,46,140,0.08);
        }

        .search-input {
            width: 100%;
            height: 2.75rem;
            padding: 0 0.9rem 0 0.9rem;
            border: none;
            background: transparent;
            color: #000;
            caret-color: #000;
            font-family: 'Lexend', sans-serif;
            font-size: 0.78rem;
            outline: none;
            opacity: 0;
            transform: translateX(0.25rem);
            transition: opacity 0.18s ease 0.05s, transform 0.18s ease 0.05s;
        }
        .search-pill:hover .search-input,
        .search-pill:focus-within .search-input {
            opacity: 1;
            transform: translateX(0);
        }
        .search-input::placeholder { color: #64748b; font-size: 0.7rem; }

        .search-btn {
            position: absolute;
            right: 0;
            top: 0;
            width: 2.75rem;
            height: 2.75rem;
            border: none;
            border-radius: 9999px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }
        .search-pill:hover .search-btn,
        .search-pill:focus-within .search-btn {
            background: #FF2E8C;
        }
        .search-btn:hover { color: #fff; }

        @media (max-width: 640px) {
            .section-header { align-items: flex-start; }
            .search-pill:hover,
            .search-pill:focus-within {
                width: 100%;
            }
        }

        /* ── Court cards grid ────────────────────────────────── */
        .courts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .court-card {
            background: rgba(26, 26, 46, 0.6);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 1.25rem; overflow: hidden;
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
        }
        .court-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255,46,140,0.25);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 24px rgba(255,46,140,0.1);
        }

        /* card image area */
        .court-img {
            position: relative; height: 11rem;
            background: linear-gradient(135deg, rgba(255,46,140,0.2), rgba(0,244,254,0.15));
            overflow: hidden;
        }
        .court-thumb {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .court-img-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(10,10,18,0.85) 0%, transparent 60%);
        }
        .sport-badge {
            position: absolute; top: 0.75rem; left: 0.75rem;
            font-size: 0.7rem; font-weight: 700;
            background: rgba(10,10,18,0.7); color: #e4e1ed;
            padding: 0.2rem 0.6rem; border-radius: 9999px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* card body */
        .court-body { padding: 1.25rem; }
        .court-name { font-size: 1.125rem; font-weight: 700; color: #fff; margin-bottom: 0.25rem; }
        .court-location {
            display: flex; align-items: center; gap: 0.25rem;
            color: #64748b; font-size: 0.75rem; margin-bottom: 1rem;
        }
        .loc-icon { font-size: 0.9rem !important; }

        /* card footer */
        .court-footer {
            display: flex; justify-content: space-between; align-items: center;
        }
        .court-price { font-size: 0.875rem; color: #FF2E8C; font-weight: 700; }
        .court-price sup { font-size: 0.65rem; }
        .court-price span { font-size: 0.7rem; color: #64748b; font-weight: 400; }

        .btn-book {
            display: flex; align-items: center; gap: 0.375rem;
            padding: 0.45rem 0.9rem; border-radius: 0.5rem; border: none; cursor: pointer;
            background: rgba(255,255,255,0.07); color: #e4e1ed;
            font-size: 0.8rem; font-weight: 600; font-family: 'Lexend', sans-serif;
            border: 1px solid rgba(255,255,255,0.1); text-decoration: none;
            transition: background 0.2s;
        }
        .btn-book:hover { background: rgba(255,255,255,0.12); }

        .btn-delete {
            padding: 0.45rem 0.9rem; border-radius: 0.5rem; cursor: pointer;
            background: transparent; border: 1px solid rgba(255,100,100,0.2);
            color: #ffb4ab; font-size: 0.8rem; font-weight: 600;
            font-family: 'Lexend', sans-serif; transition: background 0.2s;
        }
        .btn-delete:hover { background: rgba(255,100,100,0.1); }

        /* ── Alerts ──────────────────────────────────────────── */
        .alert { padding: 0.875rem 1rem; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 500; margin-bottom: 1.5rem; text-align: center; }
        .alert-success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #34d399; }
        .alert-error   { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.3);  color: #f87171; }

        /* ── Empty state ─────────────────────────────────────── */
        .empty {
            grid-column: 1 / -1;
            background: rgba(26, 26, 46, 0.6);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 1.25rem; padding: 3.5rem; text-align: center;
        }
        .empty-icon  { font-size: 3rem !important; color: #64748b; display: block; margin-bottom: 1rem; }
        .empty-title { font-size: 1.25rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
        .empty-sub   { color: #64748b; font-size: 0.875rem; }

        /* ── Footer ──────────────────────────────────────────── */
        .site-footer {
            text-align: center; margin-top: 3rem;
            font-size: 0.75rem; color: #3f3f5a;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <!-- Logo -->
        <span class="logo">PlayConnect</span>

        <!-- Nav -->
        <nav class="site-nav">
            <a th:href="@{/}" class="nav-link-active">Dashboard</a>
            <a th:href="@{/bookings}" class="nav-link">My Bookings</a>
            <a th:if="${isAdmin}" th:href="@{/admin/dashboard}" class="nav-link">Admin Dashboard</a>
            
        </nav>

        <!-- Right side -->
        <div style="display:flex;align-items:center;gap:0.75rem;">
            <form method="post" th:action="@{/logout}" style="display:inline;">
                <button class="btn-logout" type="submit">Logout</button>
            </form>
        </div>
    </header>

    <!-- Main -->
    <main class="main">

        

        <!-- Welcome Banner -->
        <div class="welcome-banner">
            <h1 class="welcome-title">Welcome <span th:text="${user}">user</span>!</h1>
            <p class="welcome-sub">Book your next court in a glance.</p>
        </div>
        <!-- Courts Section -->
        <div class="section-header">
            <h2 class="section-title">Select Court</h2>
            <div class="section-actions">
                <form class="search-pill" method="get" th:action="@{/home}">
                    <input
                        class="search-input"
                        type="text"
                        name="search"
                        th:value="${searchTerm}"
                        placeholder="Search name, location, or category"
                    />
                    <button type="submit" class="search-btn" aria-label="Search courts">
                        <span class="material-symbols-outlined icon" style="font-size:1.1rem;">search</span>
                    </button>
                </form>

                <a th:if="${isAdmin}" th:href="@{/courts/new}" class="btn-add-court">
                    <span class="material-symbols-outlined icon" style="font-size:1rem;">add</span>
                    Add Court
                </a>
            </div>
        </div>

        <div class="courts-grid">

			<!-- Alerts -->
        	<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
     		<div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

            <!-- Court Card -->
            <div class="court-card" th:each="court : ${courts}">
                <div class="court-img">
                    <img th:if="${court.thumbnailData != null}" th:src="${court.thumbnailData}" alt="Court photo" class="court-thumb" />
                    <div class="court-img-overlay"></div>
                    <span class="sport-badge" th:text="${court.sportType}">Sport</span>
                </div>
                <div class="court-body">
                    <h3 class="court-name" th:text="${court.name}">Court Name</h3>
                    <div class="court-location">
                        <span class="material-symbols-outlined loc-icon icon">location_on</span>
                        <span th:text="${court.address}">Location</span>
                    </div>
                    <div class="court-footer">
                        <div class="court-price">
                            $<span th:text="${court.pricePerHour}">0</span><span>/hr</span>
                        </div>
                        <div style="display:flex;gap:0.5rem;align-items:center;">
                            <a class="btn-book" th:href="@{'/courts/' + ${court.id} + '/schedule'}">
                                <span>Book</span>
                                <span class="material-symbols-outlined icon" style="font-size:0.875rem;">arrow_forward</span>
                            </a>
                            <form method="post" style="display:inline;" th:action="@{'/courts/' + ${court.id} + '/delete'}" th:if="${isAdmin}">
                                <button class="btn-delete" type="submit">Delete</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty state -->
            <div th:if="${courts == null or courts.size() == 0}" class="empty">
                <span class="material-symbols-outlined empty-icon icon">sports_tennis</span>
                <h3 class="empty-title" th:text="${searchTerm != null and !searchTerm.isBlank() ? 'No Courts Found' : 'No Courts Available'}">No Courts Available</h3>
                <p class="empty-sub" th:text="${searchTerm != null and !searchTerm.isBlank() ? 'Try a different name or location.' : 'Check back later or add a new court.'}">Check back later or add a new court.</p>
            </div>

        </div>
    </main>

</body>
</html>
